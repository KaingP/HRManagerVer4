services:
    - type: web
      name: hr-manager
      runtime: docker
      plan: free
      dockerfilePath: ./Dockerfile
      healthCheckPath: /healthz
      envVars:
          - key: NODE_ENV
            value: production
          - key: ADMIN_PASSWORD
            sync: false
          - key: STATE_FILE
            value: /app/state.json
          - key: DB_PATH
            value: /app/data.db
